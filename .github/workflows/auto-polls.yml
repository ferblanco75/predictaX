name: Auto-generate polls from trends

on:
  schedule:
    - cron: '0 12 * * 1,3,5'   # lunes, miércoles y viernes 12:00 UTC = 09:00 Argentina (UTC-3)
  workflow_dispatch:         # permite correrlo manualmente desde GitHub UI

jobs:
  generate-polls:
    name: Generate polls from Argentina trends
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # #257: pinned exact versions — this job runs with production admin
        # credentials in its environment; an unpinned install of any of these
        # (especially the small, single-maintainer pytrends-modern) would let
        # a compromised release on it act with those credentials.
        # google-genai matches the version locked in backend/poetry.lock.
        run: |
          pip install --upgrade pip
          pip install \
            requests==2.34.2 \
            google-genai==1.75.0 \
            python-Levenshtein==0.27.4 \
            pytrends-modern==0.2.13
          python -c "from pytrends_modern.rss import TrendsRSS; print('pytrends-modern OK')"

      - name: Run auto-polls script
        working-directory: backend
        run: python scripts/auto_polls.py
        env:
          BACKEND_URL:    ${{ secrets.BACKEND_URL }}
          ADMIN_EMAIL:    ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASS:     ${{ secrets.ADMIN_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   gemini-3.6-flash
